plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.uth.bitacora'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.uth.bitacora"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        // Emulador de Android Studio: 10.0.2.2 es el "localhost" del PC.
        // En un teléfono físico, cambia esta URL por la IP del PC (ej. http://192.168.1.50:5080/)
        // y agrega esa IP en res/xml/network_security_config.xml.
        buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:5080/\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.volley
    implementation libs.androidx.security.crypto
    testImplementation libs.junit
}
