services:
  api:
    build: .
    container_name: bitacora-api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/data/bitacora.db"
      BaseDeDatos__AplicarMigracionesAlIniciar: "true"
      # Los secretos se leen del archivo .env (excluido del repositorio)
      Jwt__Clave: "${JWT_CLAVE:?Define JWT_CLAVE en el archivo .env}"
      AdminInicial__Correo: "${ADMIN_CORREO:-}"
      AdminInicial__Contrasena: "${ADMIN_CONTRASENA:-}"
    volumes:
      - bitacora-data:/data

volumes:
  bitacora-data:
